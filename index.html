<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>АэроНаТЦ — дизайнер оболочек аэростатов</title>
<meta name="description" content="Конфигуратор оболочек тепловых аэростатов АэроНаТЦ: 3D-модель, плоская раскладка, карта цветов и спецификация ткани.">
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="styles.css?v=2">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>

<header class="top">
  <a class="brand" href="#" id="brandHome">
    <svg viewBox="0 0 34 34" aria-hidden="true" class="brand-mark">
      <path d="M17 2c6.6 0 11.6 5 11.6 11.4 0 5.6-4.3 10.8-8.4 14.2h-6.4C9.7 24.2 5.4 19 5.4 13.4 5.4 7 10.4 2 17 2Z" fill="currentColor" opacity=".16"/>
      <path d="M17 2c6.6 0 11.6 5 11.6 11.4 0 5.6-4.3 10.8-8.4 14.2h-6.4C9.7 24.2 5.4 19 5.4 13.4 5.4 7 10.4 2 17 2Z" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M17 2c3 3.4 4.6 7.4 4.6 11.4S20 21.9 17 27.6c-3-5.7-4.6-10.2-4.6-14.2S14 5.4 17 2Z" fill="none" stroke="currentColor" stroke-width="1.3" opacity=".7"/>
      <rect x="14.4" y="28.2" width="5.2" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </svg>
    <span class="brand-text">
      <b>АэроНаТЦ</b>
      <i>аэростатный научно-технический центр</i>
    </span>
  </a>

  <nav class="views" role="tablist" aria-label="Режим работы">
    <button class="view-tab is-active" data-view="3d" role="tab">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.6 14 5v6L8 14.4 2 11V5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M2 5l6 3.4L14 5M8 8.4v6" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
      <span>3D</span>
    </button>
    <button class="view-tab" data-view="layout" role="tab">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6 2.5v11M10 2.5v11M2 6.2h12M2 9.8h12" stroke="currentColor" stroke-width="1"/></svg>
      <span>Раскладка</span>
    </button>
    <button class="view-tab" data-view="preview" role="tab">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.8" y="3" width="12.4" height="9" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1.8 9.6 5.4 6.4l2.6 2.3 2.3-2 3.9 3.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
      <span>Предпросмотр</span>
    </button>
  </nav>

  <div class="top-actions">
    <button class="icon-btn" id="btnUndo" title="Отменить (Ctrl+Z)" disabled>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4.5 3 7.2l3 2.7M3.2 7.2h6.1a3.5 3.5 0 0 1 0 7H7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="icon-btn" id="btnRedo" title="Повторить (Ctrl+Shift+Z)" disabled>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 4.5l3 2.7-3 2.7M12.8 7.2H6.7a3.5 3.5 0 0 0 0 7H9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="icon-btn" id="btnTheme" title="Тема">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 9.4A5.6 5.6 0 0 1 6.6 3a5.6 5.6 0 1 0 6.4 6.4Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
    </button>
    <button class="btn primary" id="btnSave" title="Комплект на согласование"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.6h7.2L13 5.4v8H3z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M5.6 2.6v3.6h4.2V2.6M5.6 13.4V9.2h4.8v4.2" fill="none" stroke="currentColor" stroke-width="1.2"/></svg><span>Сохранить проект</span></button>
  </div>
</header>

<main id="main">
  <div id="stage">
    <canvas id="view3d"></canvas>

    <div class="stage-tools">
      <button class="icon-btn ghost" id="btnResetView" title="Исходный вид">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5V5.4h-2.9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn ghost" id="btnSeams" title="Показать швы">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h12M8 2v12" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
      <button class="icon-btn ghost" id="btnBasket" title="Вид из корзины">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.4 7.2h9.2l-.9 6H4.3z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M5 7.2 8 2l3 5.2" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M3.4 9.6h9.2" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button class="icon-btn ghost" id="btnSky" title="Небо">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.4 11.6a2.6 2.6 0 0 1 .3-5.2 3.5 3.5 0 0 1 6.6-1 2.8 2.8 0 0 1 .6 5.5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn ghost" id="btnShot" title="Скачать PNG">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.6v7.2M5 7l3 3 3-3M2.8 12.6h10.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="stage-hint" id="stageHint">Кликните по полотнищу, чтобы покрасить его активным цветом</div>
  </div>

  <aside id="panel" class="panel">
    <div class="model-card">
      <span class="label">Модель</span>
      <div class="model-row">
        <b id="modelCode">АХ-8 · 2550</b>
        <button class="link" id="btnCatalog">Сменить</button>
      </div>
      <div class="model-meta" id="modelMeta"></div>
    </div>

    <nav class="panel-tabs" id="panelTabs" role="tablist">
      <button class="ptab is-active" data-tab="color">Цвет</button>
      <button class="ptab" data-tab="valve">Клапан</button>
      <button class="ptab" data-tab="fabric">Ткани</button>
      <button class="ptab" data-tab="memo">Памятка</button>
      <button class="ptab" data-tab="export">Экспорт</button>
    </nav>

    <div class="panel-body" id="panelBody"></div>

    <footer class="panel-foot">© <span id="year"></span> АэроНаТЦ · конфигуратор оболочек v1.0</footer>
  </aside>

  <section id="layoutPane" class="layout-pane" hidden>
    <header class="layout-head">
      <b>Плоская раскладка</b>
      <span class="chip" id="layoutModel"></span>
      <div class="spacer"></div>
      <button class="btn ghost" id="btnLayoutFit">По размеру</button>
      <button class="btn ghost" id="btnLayoutPNG">Сохранить PNG</button>
      <button class="icon-btn" id="btnLayoutClose" title="Закрыть">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </header>
    <div class="layout-body">
      <aside class="layout-side" id="layoutSide"></aside>
      <canvas id="layoutCanvas"></canvas>
    </div>
  </section>

  <div id="previewBar" class="preview-bar" hidden>
    <span>Предпросмотр · ESC для выхода</span>
    <button class="btn ghost" id="btnPreviewExit">Выйти</button>
  </div>
</main>

<div id="modalRoot"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
